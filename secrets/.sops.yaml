# Sops configuration for damathryxx64
# Keys are derived from user Age keys or converted SSH ed25519 keys
# Age key location: ~/.config/sops/age/keys.txt
#
# Quickstart:
# 1. Generate an Age key:
#    mkdir -p ~/.config/sops/age
#    age-keygen -o ~/.config/sops/age/keys.txt
# 2. Get the public key:
#    age-keygen -y ~/.config/sops/age/keys.txt
# 3. Add the public key to creation_rules below.
# 4. Create/edit encrypted secrets:
#    sops secrets/secrets.yaml

creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env)$
    # age: "age1..."
