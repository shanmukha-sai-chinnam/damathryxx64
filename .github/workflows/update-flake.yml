name: Update Flake and Auto Push

# This workflow updates flake.lock daily, verifies formatting and quality gates,
# validates Nix flake derivations with binary caching, and pushes updates to trunk.

on:
  schedule:
    - cron: "0 3 * * *" # Runs daily at 03:00 UTC
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  update-flake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update Flake Lock
        run: nix flake update

      - name: Check for Lock Changes
        id: check_changes
        run: |
          if git diff --quiet flake.lock; then
            echo "No changes in flake.lock."
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates detected in flake.lock."
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Format Nix Expressions
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: nix fmt -- .

      - name: Verify Flake Quality Gates
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          nix flake check --impure
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel --impure --no-link

      - name: Commit and Push Changes
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(flake): automated flake.lock input update"
          git push origin trunk
