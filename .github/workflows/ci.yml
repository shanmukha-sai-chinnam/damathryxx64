name: CI Quality Gates

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Format & Flake Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Values Schema Integrity
        run: |
          python3 -c '
          import json, sys
          with open("values.json") as f:
              d = json.load(f)
          req = ["identity", "system", "wsl", "windows", "paths", "github", "security"]
          missing = [k for k in req if k not in d]
          if missing:
              print(f"Error: values.json missing required keys: {missing}", file=sys.stderr)
              sys.exit(1)
          '

      - name: Run Antigravity Superpowers Verification Suite
        run: |
          node pkgs/antigravity-superpowers/bin/antigravity-superpowers.js check .

      - name: Verify Flake Quality Gates (Alejandra, Statix, Deadnix, Checks)
        run: |
          nix flake check --impure

      - name: Build Monorepo Packages (Hermetic Sandbox)
        run: |
          nix build .#clamav-sentinel --no-link
          nix build .#antigravity-superpowers --no-link
